name: Build Go Binaries

on:
  push:
    branches: [main]
    paths:
      - 'src/go/**'
      - '.github/workflows/build-go.yml'

  pull_request:
    branches: [main]
    paths:
      - 'src/go/**'
      - '.github/workflows/build-go.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum

      # The binary is pure Go (no CGO), so it needs no C toolchain or conda env.
      - name: Build Go binary (Unix)
        if: runner.os != 'Windows'
        run: make -B
        working-directory: src/go

      # The Makefile is Unix-only (make + shell conditionals), so Windows runs
      # go build directly and checks the resulting exe starts.
      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: src/go
        run: |
          set -euxo pipefail
          mkdir -p build
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o build/sfg_windows_amd64.exe -buildvcs=false ./cmd
          ./build/sfg_windows_amd64.exe --help >/dev/null

  commit-binaries:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: go-binary-*
          path: src/go/build/
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x src/go/build/sfg_*

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/go/build/sfg_*
          git diff --staged --quiet && echo "No binary changes." || (
            git commit -m "chore: update pre-built Go binaries [skip ci]" &&
            git push
          )