name: Build Go Binaries

on:
  push:
    branches: [main]
    paths:
      - 'src/go/**'
      - '.github/workflows/build-go.yml'

  pull_request:
    branches: [main]
    paths:
      - 'src/go/**'
      - '.github/workflows/build-go.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pixi-env: tiledb
          - os: macos-latest   # arm64
            pixi-env: tiledb
          - os: windows-latest
            pixi-env: tiledb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: ${{ matrix.pixi-env }}
          locked: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum

      - name: Build Go binary (Unix)
        if: runner.os != 'Windows'
        run: pixi run -e ${{ matrix.pixi-env }} build-go

      # Spike: the Makefile is Unix-only (make/shell); Windows CI has no `make`,
      # and conda-on-Windows lays out headers/libs under Library/{include,lib}
      # instead of the Unix {include,lib}. This step is a temporary inline
      # stand-in while we validate that pixi's win-64 gcc (go-cgo dependency)
      # can link against conda-forge's MSVC-built tiledb win-64 package.
      - name: Build Go binary (Windows, spike)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          PREFIX="$(pwd)/.pixi/envs/${{ matrix.pixi-env }}/Library"
          mkdir -p src/go/build
          cd src/go
          pixi run -e ${{ matrix.pixi-env }} bash -c "
            set -euxo pipefail
            which gcc
            gcc --version
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            CGO_CFLAGS='-I${PREFIX}/include' \
            CGO_LDFLAGS='-L${PREFIX}/lib -ltiledb' \
            go build -o build/sfg_windows_amd64.exe -buildvcs=false ./cmd
            echo '--- smoke test: does the exe actually run? ---'
            PATH=\"${PREFIX}/bin:\$PATH\" ./build/sfg_windows_amd64.exe --help
          "

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-binary-${{ matrix.os }}
          path: src/go/build/sfg_*
          if-no-files-found: error

  commit-binaries:
    needs: build
    # Only commit binaries on direct push to main, not on PRs.
    # On PRs, github.ref_name is "<pr_number>/merge" which is not a real branch.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: go-binary-*
          path: src/go/build/
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x src/go/build/sfg_*

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/go/build/sfg_*
          git diff --staged --quiet && echo "No binary changes." || (
            git commit -m "chore: update pre-built Go binaries [skip ci]" &&
            git push
          )
