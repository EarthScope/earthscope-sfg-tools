name: SFG tooling tests
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-python.yml'

jobs:
  test-formatting-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          locked: false

      - name: Check formatting with ruff
        run: pixi run format-check

      - name: compile Go binaries
        run: pixi run -e tiledb build-go

      - name: Run tests
        run: pixi run -e tiledb test
