[project]
authors = [
  { name = "Mike Gottlieb", email = "mike.gottlieb@earthscope.org" },
  { name = "Franklyn Dunbar", email = "franklyn.dunbar@earthscope.org" },
  { name = "Rachel Akie", email = "rachel.akie@earthscope.org" }
]
# pypi dependencies
dependencies = [
  "julian>=0.14",
  "numpy>=1.26",
  "pandas>=2.2",
  "pandera>=0.20",
  "pydantic>=2.7",
  "pymap3d>=3.1"
]
name = "earthscope-sfg-tools"
requires-python = ">= 3.11"
version = "0.1.0"

[project.optional-dependencies]
tiledb = ["tiledb>=0.30"]
docs = ["myst-parser>=5.1.0"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
pytest = ">=8"
ruff = ">=0.4"
matplotlib = ">=3.10.9,<4"
cloudpathlib = ">=0.24.0,<0.25"

[tool.pixi.pypi-dependencies]
earthscope_sfg_tools = { path = ".", editable = true }

[tool.pixi.feature.tiledb.dependencies]
tiledb = ">=2.27"

[tool.pixi.feature.tiledb.pypi-dependencies]
tiledb = ">=0.30"

[tool.pixi.feature.jupyter.dependencies]
jupyter = ">=1.1.1"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
tiledb = { features = ["tiledb"], solve-group = "default" }
geolab = { features = ["jupyter","tiledb"], solve-group = "default" }


[tool.pixi.tasks]
build-go = { cmd = "make -B", cwd= "src/go", description = "Build Go binary for Novatel to RINEX conversion" }
test = { cmd = "pytest tests/ -v", description = "Run the test suite" }
lint = { cmd = "ruff check src/ tests/", description = "Lint with ruff" }
format-check = { cmd = "ruff format --check src/ tests/", description = "Check formatting" }
format = { cmd = "ruff format src/ tests/", description = "Auto-format source" }
docs = { cmd = "myst start", description = "Serve docs locally with live reload" }
docs-build = { cmd = "myst build --html", description = "Build docs as static HTML" }

# =============================================================================
# Activation - environment variables
# =============================================================================
[tool.pixi.activation]
[tool.pixi.activation.env]
CGO_ENABLED = "1"
DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/$PIXI_ENVIRONMENT_NAME/lib:$DYLD_LIBRARY_PATH"
LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/$PIXI_ENVIRONMENT_NAME/lib:$LD_LIBRARY_PATH"
